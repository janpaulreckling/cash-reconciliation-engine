name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group dbt
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      # dbt on an empty warehouse: compiles every model, runs the unit tests and all
      # data tests (no sandbox access or secrets in CI).
      - run: uv run python -c "from recon.warehouse import Warehouse; Warehouse('recon.duckdb').close()"
      - run: make dbt
