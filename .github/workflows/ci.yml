name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group dbt --group app
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      # End to end on the committed snapshot of a real seeded run (no sandbox keys):
      # load -> dbt build (models + reconciliation tests) -> match -> dbt again,
      # then fail the build if matching quality drops.
      - run: uv run recon demo --db ci.duckdb
      - run: uv run recon evaluate --db ci.duckdb --min-precision 1.0 --min-recall 0.95
      # Holdout (patterns the engine wasn't tuned on): never a wrong automatic match,
      # recall may be lower; the README reports the misses.
      - run: uv run recon evaluate --db ci.duckdb --truth seeds/holdout --min-precision 1.0 --min-recall 0.9
      # The Tableau dashboard's CSVs must match the snapshot and tie to the close summary.
      - run: uv run python scripts/export_bi.py --db ci.duckdb && git diff --exit-code bi/
