[project]
name = "cash-reconciliation-engine"
version = "0.1.0"
description = "Matches Stripe payouts, bank deposits and ERP invoices for month-end close, with confidence scoring, exception queue and audit trail."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.3",
    "typer>=0.12",
    "rich>=13.7",
    "pytz>=2026.6",
    "stripe>=17.0.0",
]

[dependency-groups]
dbt = [
    "dbt-duckdb>=1.11.1",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pytz>=2026.6.0.20261031",
]

[project.scripts]
recon = "recon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=recon --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
