# Light and dark themes; viewers switch under ⋮ → Settings → Theme (or follow the OS).
[theme]
font = "sans-serif"
baseRadius = "medium"
showSidebarBorder = true

[theme.light]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f4f3f0"
textColor = "#0b0b0b"

[theme.dark]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#232322"
textColor = "#f0efec"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
