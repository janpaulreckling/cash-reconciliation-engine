version: 2

sources:
  - name: raw
    description: Append-only version logs written by `recon extract *` (one row per record version).
    tables:
      - name: erp_invoices
        description: Odoo account.move, customer invoices and credit notes, all states.
      - name: stripe_charges
      - name: stripe_refunds
      - name: stripe_disputes
      - name: stripe_balance_transactions
      - name: stripe_payouts
      - name: bank_transactions
        description: Plaid transactions. Plaid sign convention, positive = money out.
      - name: bank_accounts

  - name: engine
    description: Written by `recon match`. One row per decision (and per linked invoice).
    tables:
      - name: current_decisions
        description: Decisions of the latest matching run.
      - name: match_runs
